name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Lifecycle scripts never run: esbuild ships its binary as an optional dependency.
      - run: npm ci --ignore-scripts
      - name: Verify npm registry signatures
        run: npm audit signatures
      - name: Check for known high-severity vulnerabilities
        run: npm audit --audit-level=high
      - name: Check for unsafe DOM and eval sinks
        run: |
          if grep -rnE 'innerHTML|outerHTML|insertAdjacentHTML|document\.write|\beval\(|new Function\(' src; then
            echo "Found an HTML or eval sink in src/. Use textContent and DOM APIs instead." >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: swift test --package-path native/eden-bridge
      - run: npm run build:native
      - name: Capture agent security checks
        run: node test/harness/bridge-security.mjs
      - run: npx vsce package --no-dependencies -o retroverse.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retroverse-vsix
          path: retroverse.vsix
          if-no-files-found: error
