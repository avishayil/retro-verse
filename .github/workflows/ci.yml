name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: swift test --package-path native/eden-bridge
      - run: npm run build:native
      - run: npx vsce package --no-dependencies -o retroverse.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: retroverse-vsix
          path: retroverse.vsix
          if-no-files-found: error
