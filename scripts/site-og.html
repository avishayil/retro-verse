<!DOCTYPE html>
<!-- Source for site/assets/og.png (1200x630 social card), rendered by scripts/site-assets.mjs. Not deployed. -->
<html lang="en"><head><meta charset="UTF-8"><style>
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #eef1fb;
    background: radial-gradient(ellipse 60% 70% at 80% 40%, rgba(91,75,214,.35), transparent 70%), radial-gradient(circle, rgba(179,168,255,.14) 1px, transparent 1.5px) 0 0 / 16px 16px, #0b0f1e; }
  .wrap { display: grid; grid-template-columns: 1fr 360px; gap: 48px; align-items: center; height: 100%; padding: 0 72px; box-sizing: border-box; }
  .mark { height: 56px; image-rendering: pixelated; }
  h1 { font: 700 54px/1.15 ui-monospace, "SF Mono", Menlo, monospace; margin: 36px 0 20px; letter-spacing: -0.01em; }
  p { font-size: 26px; color: #aab3d1; margin: 0; }
  .chips { display: flex; gap: 14px; margin-top: 34px; }
  .chip { font: 700 20px ui-monospace, Menlo, monospace; padding: 8px 14px; background: #1a2242; border: 3px solid #5361b3; }
  .chip.on { background: #22c55e; border-color: #22c55e; color: #06130b; }
  .shot { border: 6px solid #5361b3; box-shadow: 0 0 0 6px #3a2d9c, 0 30px 60px rgba(58,45,156,.5); height: 520px; overflow: hidden; }
  .shot img { width: 100%; display: block; }
</style></head><body><div class="wrap">
  <div>
    <img class="mark" src="../site/assets/wordmark.svg" alt="">
    <h1>Play retro games in VS Code, next to your code.</h1>
    <p>Game Boy Advance, Nintendo DS and Switch, in the Explorer.</p>
    <div class="chips"><span class="chip">GBA</span><span class="chip">DS</span><span class="chip">Switch</span><span class="chip on">Free + open source</span></div>
  </div>
  <div class="shot"><img src="../site/assets/explorer-player.png" alt=""></div>
</div></body></html>
